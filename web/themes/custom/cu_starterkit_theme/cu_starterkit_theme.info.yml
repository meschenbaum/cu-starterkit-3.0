name: 'CU StarterKit Theme'
type: theme
base theme: stable9
description: 'CU System Starter Kit Theme for Drupal 10+'
alt text: Screenshot of CU System StarterKit Theme.
package: CU System
starterkit: true
generator: 'starterkit_theme:10.2.2'
core_version_requirement: ^10
version: VERSION

dependencies:
#  - drupal:block
#  - drupal:block_content
#  - drupal:breakpoint
#  - drupal:ckeditor5
#  - drupal:datetime
#  - drupal:datetime_range
#  - drupal:editor
#  - drupal:entity_reference_revisions
#  - drupal:entity_usage
#  - drupal:field
#  - drupal:field_group
#  - drupal:field_ui
#  - drupal:file
#  - drupal:filter
#  - drupal:help
#  - drupal:image
#  - drupal:layout_discovery
#  - drupal:layout_paragraphs
#  - drupal:layout_paragraphs_library
#  - drupal:layout_paragraphs_permissions
#  - drupal:link
#  - drupal:media
#  - drupal:media_library
#  - drupal:menu_link_content
#  - drupal:menu_ui
#  - drupal:metatag
#  - drupal:node
#  - drupal:paragraphs
#  - drupal:paragraphs_library
#  - drupal:paragraphs_type_permissions
